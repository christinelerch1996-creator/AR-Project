<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leonora – 3D mascot</title>
<style>
:root{--bg:#f6eef2;--fg:#43303a;--chip:#ffffffd9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1419;--fg:#f1e3ea;--chip:#2c2229d9}}
:root[data-theme="dark"]{--bg:#1a1419;--fg:#f1e3ea;--chip:#2c2229d9}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.ui{position:fixed;left:0;right:0;bottom:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;align-items:center;font-size:13px;pointer-events:none}
.ui>*{pointer-events:auto;background:var(--chip);color:var(--fg);border:0;border-radius:999px;padding:8px 14px}
button{cursor:pointer;font:inherit}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui"><span>Drag to rotate, scroll to zoom</span><button id="auto">Auto-rotate: on</button><button id="exp">Download .glb</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
const T = THREE;
window.addEventListener('error', (e) => { const d = document.createElement('div'); d.style.cssText = 'position:fixed;top:8px;left:8px;right:8px;padding:8px;background:#fff;color:#b00;font:12px monospace;z-index:9'; d.textContent = 'Error: ' + e.message; document.body.appendChild(d); });
const S = new T.SphereGeometry(1, 48, 32);

// fuzzy plush noise used as a bump map
const nc = document.createElement('canvas'); nc.width = nc.height = 128;
const nx = nc.getContext('2d'), id = nx.createImageData(128, 128);
for (let i = 0; i < id.data.length; i += 4) { const v = 90 + Math.random() * 120; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
nx.putImageData(id, 0, 0);
const noise = new T.CanvasTexture(nc); noise.wrapS = noise.wrapT = T.RepeatWrapping; noise.repeat.set(6, 6);

const cache = {};
function M(c, sheen) {
  const k = c + '' + !!sheen; if (cache[k]) return cache[k];
  return cache[k] = new T.MeshPhysicalMaterial({ color: c, roughness: 1, metalness: 0, bumpMap: noise, bumpScale: 0.5, sheen: 1, sheenRoughness: 0.6, sheenColor: new T.Color(sheen || 0xffffff).multiplyScalar(0.5) });
}
const C = { hair: 0xf3c93f, hair2: 0xdfa92b, hair3: 0xffdf6e, ribbon: 0xe8566f, skin: 0xfbdcca, teal: 0x2f5c68, tealD: 0x244a55, red: 0xd9475f, pink: 0xee6f8c, navy: 0x1d2c3c, black: 0x22202a, purple: 0xc7a3e0 };

function ell(mat, sx, sy, sz, x, y, z, parent, geo) {
  const m = new T.Mesh(geo || S, mat); m.scale.set(sx, sy, sz); m.position.set(x, y, z); parent.add(m); return m;
}
function tex(draw, size) {
  const c = document.createElement('canvas'); c.width = c.height = size || 256; draw(c.getContext('2d'));
  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; return t;
}
const eyeTex = tex((x) => {
  const g = x.createLinearGradient(0, 40, 0, 236);
  g.addColorStop(0, '#12356b'); g.addColorStop(0.55, '#2a6fd0'); g.addColorStop(1, '#8ccaff');
  x.fillStyle = g; x.beginPath(); x.ellipse(128, 138, 84, 98, 0, 0, 7); x.fill();
  x.lineWidth = 7; x.strokeStyle = '#0f1f3f'; x.stroke();
  x.fillStyle = '#0a1a3a'; x.beginPath(); x.ellipse(128, 130, 34, 50, 0, 0, 7); x.fill();
  x.strokeStyle = 'rgba(255,205,210,.55)'; x.lineWidth = 8; x.beginPath(); x.ellipse(128, 150, 60, 64, 0, 0.25 * Math.PI, 0.75 * Math.PI); x.stroke();
  x.fillStyle = '#fff'; x.beginPath(); x.ellipse(96, 88, 24, 28, 0, 0, 7); x.fill();
  x.beginPath(); x.ellipse(160, 192, 11, 11, 0, 0, 7); x.fill();
  x.strokeStyle = '#2a0a14'; x.lineCap = 'round'; x.lineWidth = 15;
  x.beginPath(); x.ellipse(128, 138, 86, 100, 0, Math.PI * 1.04, Math.PI * 1.96); x.stroke();
  x.lineWidth = 11; x.beginPath(); x.moveTo(205, 70); x.quadraticCurveTo(232, 58, 244, 38); x.stroke();
});
const blushTex = tex((x) => {
  const g = x.createRadialGradient(64, 64, 4, 64, 64, 62);
  g.addColorStop(0, 'rgba(255,110,125,.6)'); g.addColorStop(1, 'rgba(255,110,125,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
}, 128);
const decal = (map) => new T.MeshBasicMaterial({ map, transparent: true, side: T.DoubleSide, depthWrite: false });

// Builds the whole plush; reuse in your own project and add the returned group to your scene.
function buildTeto() {
  const g = new T.Group(), hg = new T.Group(); hg.position.y = 0.2; g.add(hg);
  const H1 = M(C.hair, 0xfff0b0), H2 = M(C.hair2, 0xfff0b0), H3 = M(C.hair3, 0xfff0b0);

  // head, back hair, hair cap
  ell(M(C.skin), 1.2, 1, 1.08, 0, 1.5, 0, hg);
  ell(H1, 1.3, 1.22, 1.18, 0, 1.45, -0.32, hg);
  ell(H2, 1.0, 1.0, 0.9, 0, 1.25, -0.75, hg);
  ell(H1, 1.24, 1.05, 1.12, 0, 1.5, 0, hg, new T.SphereGeometry(1, 48, 24, 0, Math.PI * 2, 0, 1.2));
  // side hair masses tie the cap, side locks and tails together
  [-1, 1].forEach((s) => { ell(H1, 0.32, 0.64, 0.55, s * 1.0, 1.2, -0.05, hg); ell(H2, 0.55, 0.45, 0.45, s * 1.2, 1.85, -0.1, hg); });

  // spiky bangs and side locks: [angle, top y, width, length, tilt]
  [[-1.25, 1.85, .28, .95, .1], [1.25, 1.85, .28, .95, -.1], [-.8, 1.9, .26, .5, .35], [.8, 1.9, .26, .5, -.35],
   [-.42, 1.93, .25, .32, .2], [.42, 1.93, .25, .32, -.2], [0, 1.96, .3, .35, 0], [-1.05, 1.8, .3, .8, .18], [1.05, 1.8, .3, .8, -.18], [-.62, 1.92, .26, .34, .3], [.62, 1.92, .26, .34, -.3]].forEach(([f, yt, w, h, rz], i) => {
    const yc = yt - h / 2, r = Math.sqrt(Math.max(0.05, 1 - (yc - 1.5) ** 2)) * 1.07;
    const m = new T.Mesh(strandGeo(-Math.sign(f) * 0.3 * (1 + (i % 3) * 0.3)), i % 2 ? H2 : H1);
    m.scale.set(w * 1.3, h * 1.05, 0.3); m.position.set(1.2 * Math.sin(f) * r, yc, 1.08 * Math.cos(f) * r);
    m.rotation.set(0, f, Math.PI + rz); hg.add(m);
  });

  // ahoge
  const ah = new T.CatmullRomCurve3([[0, 2.35, 0.05], [0, 2.75, 0.05], [0.12, 3.05, 0.05], [0.45, 3.22, 0.05]].map((p) => new T.Vector3(...p)));
  try { const ahoge = taperTube(ah, 40, 12, (t) => 0.1 * Math.pow(Math.max(0, 1 - t), 0.7) + 0.008, H1); ahoge.scale.z = 0.6; hg.add(ahoge); } catch (err) { console.error(err); }

  // face: eyes, blush, mouth
  [-1, 1].forEach((s) => {
    const e = new T.Mesh(new T.PlaneGeometry(0.72, 0.72), decal(eyeTex));
    e.position.set(s * 0.42, 1.3, 1.02); e.rotation.y = s * 0.3; e.scale.x = s; hg.add(e);
    const b = new T.Mesh(new T.PlaneGeometry(0.5, 0.5), decal(blushTex));
    b.position.set(s * 0.78, 0.98, 0.62); b.rotation.y = s * 0.8; hg.add(b);
    // headset ear pad
    try { drill(s, hg, H1, H2, H3, M(C.ribbon)); } catch (err) { console.error(err); }
  });
  const mic = new T.CatmullRomCurve3([[-1.28, 1.2, .25], [-1.26, .95, .7], [-1.05, .82, .9], [-.9, .78, 1.0]].map((p) => new T.Vector3(...p)));

  const mouth = new T.Mesh(new T.TorusGeometry(0.12, 0.015, 8, 24, Math.PI), new T.MeshBasicMaterial({ color: 0x4a2a2f }));
  mouth.rotation.z = Math.PI; mouth.position.set(0, 0.9, 0.83); hg.add(mouth);

  // torso, placket, buttons, collar, waistband
  const tz = (x, y) => 0.52 * Math.sqrt(Math.max(0, 1 - (x / 0.62) ** 2 - ((y - 0.45) / 0.6) ** 2)) + 0.01;
  ell(M(C.teal), 0.62, 0.6, 0.52, 0, 0.45, 0, g);
  [-1, 1].forEach((s) => ell(M(C.red), 0.035, 0.22, 0.03, s * 0.1, 0.38, tz(s * 0.1, 0.38), g));
  [0.55, 0.4, 0.25].forEach((y) => ell(M(C.navy), 0.045, 0.045, 0.03, 0, y, tz(0, y) + 0.01, g));
  [0.3, 0.17].forEach((y) => ell(M(C.pink), 0.05, 0.05, 0.03, -0.36, y, tz(-0.36, y) + 0.01, g));
  const collar = new T.Mesh(new T.TorusGeometry(0.5, 0.07, 12, 40), M(C.tealD)); collar.rotation.x = Math.PI / 2; collar.scale.y = 0.86; collar.position.y = 0.72; g.add(collar);
  const ct = new T.Mesh(new T.TorusGeometry(0.5, 0.025, 8, 40), M(C.red)); ct.rotation.x = Math.PI / 2; ct.scale.y = 0.86; ct.position.y = 0.66; g.add(ct);
  const wb = new T.Mesh(new T.TorusGeometry(0.54, 0.035, 8, 40), M(C.red)); wb.rotation.x = Math.PI / 2; wb.scale.y = 0.85; wb.position.y = 0.1; g.add(wb);

  // pleated skirt, red band, ruffle
  const sg = new T.CylinderGeometry(0.56, 1.0, 0.6, 64, 6), p = sg.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i), k = 1 + 0.05 * ((0.3 - y) / 0.6) * Math.cos(Math.atan2(z, x) * 22);
    p.setXYZ(i, x * k, y, z * k);
  }
  sg.computeVertexNormals();
  const sk = new T.Mesh(sg, M(C.teal)); sk.position.y = -0.2; g.add(sk);
  const band = new T.Mesh(new T.TorusGeometry(0.93, 0.03, 8, 64), M(C.red)); band.rotation.x = Math.PI / 2; band.position.y = -0.36; g.add(band);
  const ruf = new T.Mesh(new T.CylinderGeometry(0.98, 1.1, 0.14, 48), M(C.pink)); ruf.position.y = -0.46; g.add(ruf);

  // arms: bare shoulder, upper arm, flared detached sleeve with trim, hand
  [-1, 1].forEach((s) => {
    ell(M(C.skin), 0.2, 0.2, 0.2, s * 0.62, 0.7, 0.02, g);
    const a = new T.Group(); a.position.set(s * 0.62, 0.66, 0.02); a.rotation.z = s * 0.7; g.add(a);
    const up = new T.Mesh(new T.CylinderGeometry(0.14, 0.16, 0.3, 16), M(C.skin)); up.position.y = -0.15; a.add(up);
    const sl = new T.Mesh(new T.CylinderGeometry(0.19, 0.3, 0.62, 24), M(C.teal)); sl.position.y = -0.58; a.add(sl);
    [[0.2, -0.27], [0.31, -0.89]].forEach(([R, y]) => {
      const t = new T.Mesh(new T.TorusGeometry(R, 0.035, 8, 28), M(C.red)); t.rotation.x = Math.PI / 2; t.position.y = y; a.add(t);
    });
    ell(M(C.skin), 0.15, 0.15, 0.15, 0, -0.93, 0, a);
    // legs and shoes
    const leg = new T.Mesh(new T.CylinderGeometry(0.21, 0.21, 0.7, 18), M(C.black)); leg.rotation.x = Math.PI / 2; leg.position.set(s * 0.33, -0.26, 0.62); g.add(leg);
    ell(M(C.black), 0.31, 0.12, 0.4, s * 0.33, -0.42, 1.08, g);
    ell(M(C.red, 0xff9aa8), 0.3, 0.27, 0.38, s * 0.33, -0.24, 1.08, g);
  });

  const sh = new T.Mesh(new T.CircleGeometry(2.0, 40), new T.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.13 }));
  sh.rotation.x = -Math.PI / 2; sh.position.y = -0.5; sh.name = 'shadow'; g.add(sh);
  return g;
}

// swept tube with a custom radius along a curve (tails and ahoge)
function taperTube(curve, seg, rad, radius, mat) {
  const fr = curve.computeFrenetFrames(seg, false), pos = [], idx = [];
  for (let i = 0; i <= seg; i++) {
    const p = curve.getPointAt(i / seg), r = radius(i / seg), n = fr.normals[i], b = fr.binormals[i];
    for (let j = 0; j <= rad; j++) {
      const a = (j / rad) * Math.PI * 2, c = Math.cos(a) * r, s = Math.sin(a) * r;
      pos.push(p.x + c * n.x + s * b.x, p.y + c * n.y + s * b.y, p.z + c * n.z + s * b.z);
    }
  }
  for (let i = 0; i < seg; i++) for (let j = 0; j < rad; j++) { const a = i * (rad + 1) + j, b = a + rad + 1; idx.push(a, b, a + 1, b, b + 1, a + 1); }
  const g = new T.BufferGeometry(); g.setAttribute('position', new T.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const m = mat.clone(); m.side = T.DoubleSide; return new T.Mesh(g, m);
}

// tapered, bendy bang strand that curls in to follow the head
function strandGeo(bend) {
  const g = new T.ConeGeometry(1, 1, 16, 8), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const d = p.getY(i) + 0.5; p.setX(i, p.getX(i) + bend * d * d); p.setZ(i, p.getZ(i) - 0.6 * d * d); }
  g.computeVertexNormals(); return g;
}

// natural pigtail: one thick, softly wavy lock plus two thinner side locks, tied with a ribbon
function drill(s, parent, m1, m2, m3, ribbon) {
  let first;
  [[0, 0, 1.2, 1, m1, 0], [0.17, 0.13, 0.95, 0.7, m2, 1.5], [-0.12, -0.1, 0.8, 0.6, m3, 3]].forEach(([dx, dz, len, k, m, ph]) => {
    const pts = [];
    for (let i = 0; i <= 60; i++) {
      const t = i / 60;
      pts.push(new T.Vector3(s * (1.12 + 0.42 * Math.sin(t * 2.4) + dx) + 0.1 * Math.sin(t * 7 + ph), 1.95 - len * t, -0.12 + dz + 0.12 * Math.sin(t * 5 + ph)));
    }
    if (!first) first = pts;
    parent.add(taperTube(new T.CatmullRomCurve3(pts), 100, 14, (t) => k * (0.28 * Math.pow(Math.max(0, 1 - t), 0.75) + 0.02), m));
  });
  const rg = new T.Group(); rg.position.copy(first[6]); rg.lookAt(first[8]);
  rg.add(new T.Mesh(new T.TorusGeometry(0.3, 0.09, 12, 32), ribbon)); parent.add(rg);
}

const cv = document.getElementById('c');
const renderer = new T.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new T.Scene(), cam = new T.PerspectiveCamera(35, 1, 0.1, 100);
scene.add(new T.HemisphereLight(0xffffff, 0xa08898, 1.7));
const dl = new T.DirectionalLight(0xffffff, 2.2); dl.position.set(3, 5, 6); scene.add(dl);
const fl = new T.DirectionalLight(0xffd6e0, 0.8); fl.position.set(-5, 2, -3); scene.add(fl);
const pivot = new T.Group(), toy = buildTeto(); toy.position.y = -1.4; pivot.add(toy); scene.add(pivot);

let ry = 0.4, rx = 0.08, dist = 11, auto = true, drag = false, lx = 0, ly = 0;
function resize() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
cv.addEventListener('pointerdown', (e) => { drag = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; });
cv.addEventListener('pointermove', (e) => {
  if (!drag) return;
  ry += (e.clientX - lx) * 0.01; rx = Math.max(-0.6, Math.min(0.8, rx + (e.clientY - ly) * 0.006)); lx = e.clientX; ly = e.clientY;
});
['pointerup', 'pointercancel'].forEach((n) => cv.addEventListener(n, () => { drag = false; cv.style.cursor = 'grab'; }));
cv.addEventListener('wheel', (e) => { e.preventDefault(); dist = Math.max(6, Math.min(16, dist + e.deltaY * 0.006)); }, { passive: false });
const btn = document.getElementById('auto');
btn.onclick = () => { auto = !auto; btn.textContent = 'Auto-rotate: ' + (auto ? 'on' : 'off'); };
// export a real-size (about 0.36 m tall) .glb, feet on the floor, facing +Z
document.getElementById('exp').onclick = () => {
  const ex = buildTeto(), sh = ex.getObjectByName('shadow'); if (sh) ex.remove(sh);
  const k = 0.092, root = new T.Group(); root.name = 'Leonora'; ex.scale.setScalar(k); ex.position.y = 0.54 * k; root.add(ex);
  new GLTFExporter().parse(root, (buf) => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], { type: 'model/gltf-binary' })); a.download = 'leonora.glb'; a.click();
  }, (e) => alert('Export failed: ' + e), { binary: true });
};
(function loop() {
  if (auto && !drag) ry += 0.005;
  pivot.rotation.set(rx, ry, 0);
  cam.position.set(0, 0.6, dist / Math.min(1, cam.aspect * 1.3)); cam.lookAt(0, 0, 0);
  renderer.render(scene, cam); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
