<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonora – AR mascot</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
html,body{height:100%;margin:0;background:#f6eef2;font-family:system-ui,sans-serif}
model-viewer{width:100%;height:100%;--poster-color:transparent}
#ar{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);padding:14px 22px;border:0;border-radius:999px;background:#2f5c68;color:#fff;font-size:16px}
</style>
</head>
<body>
<model-viewer src="leonora.glb" alt="Leonora, a 3D mascot" ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" camera-controls auto-rotate shadow-intensity="1">
  <button slot="ar-button" id="ar">View in your room</button>
</model-viewer>
</body>
</html>
